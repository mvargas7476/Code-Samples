<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="text-scale" content="scale" />
        <script>
            // Set the theme on <html> before first paint so there's no flash of the
            // wrong palette on load. Reads the saved choice; defaults to dark.
            // Keep the 'gm-theme' key and the default-dark rule in sync with
            // src/lib/theme.svelte.ts
            try {
                var t = localStorage.getItem('gm-theme');
                document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
            } catch (e) {}
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
